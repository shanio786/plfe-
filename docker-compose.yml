x-runtime-environment: &runtime-environment
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:?Set the limited runtime DATABASE_URL}
  APP_URL: ${APP_URL:?Set the external HTTPS APP_URL}
  APP_HOST: 0.0.0.0
  ACCOUNTING_TIMEZONE: ${ACCOUNTING_TIMEZONE:-Asia/Karachi}
  PORT: "3000"
  UPLOAD_DIR: /app/var/uploads
  SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-__Host-plfe-session}
  PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-10}
  BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
  LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
  LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
  SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-240}
  SESSION_MAX_MINUTES: ${SESSION_MAX_MINUTES:-840}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
  UPLOAD_ALLOWED_MIME: ${UPLOAD_ALLOWED_MIME:-application/pdf,image/jpeg,image/png,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/plain}
  WORKER_CLEANUP_CRON: ${WORKER_CLEANUP_CRON:-*/15 * * * *}

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    environment: *runtime-environment
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - uploads:/app/var/uploads
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/plfe/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
  worker:
    build: .
    restart: unless-stopped
    command: ["npm","run","worker"]
    environment: *runtime-environment
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - uploads:/app/var/uploads
  maintenance:
    profiles: ["maintenance"]
    build: .
    command: ["npm","run","db:migrate"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:-}
      SEED_OWNER_NAME: ${SEED_OWNER_NAME:-}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:-}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-10}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
    depends_on:
      postgres: {condition: service_healthy}
  nginx:
    image: nginx:stable-bookworm
    restart: unless-stopped
    ports: ["80:80","443:443"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certificates:/etc/letsencrypt:ro
      - ./deploy/acme:/var/www/acme:ro
    depends_on: [app]
volumes:
  postgres_data:
  uploads:
