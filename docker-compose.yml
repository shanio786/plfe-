services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      UPLOAD_DIR: /app/var/uploads
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - uploads:/app/var/uploads
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/plfe/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
  worker:
    build: .
    restart: unless-stopped
    command: ["npm","run","worker"]
    env_file: .env
    environment:
      NODE_ENV: production
      UPLOAD_DIR: /app/var/uploads
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - uploads:/app/var/uploads
  nginx:
    image: nginx:stable-bookworm
    restart: unless-stopped
    ports: ["80:80","443:443"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certificates:/etc/letsencrypt:ro
      - ./deploy/acme:/var/www/acme:ro
    depends_on: [app]
volumes:
  postgres_data:
  uploads:
