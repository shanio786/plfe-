openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
servers:
  - url: /api/plfe
paths:
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /session:
    get:
      operationId: getSession
      responses:
        "200":
          description: Current identity and accessible companies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
    delete:
      operationId: logout
      responses:
        "200":
          description: Signed out
  /{company}/{resource}:
    parameters:
      - {name: company, in: path, required: true, schema: {type: string}}
      - {name: resource, in: path, required: true, schema: {type: string}}
    get:
      operationId: listFoundation
      description: "Optional query parameters: search, page, pageSize, sort, direction, status, export=xlsx. See frontend-contract.md."
      responses:
        "200":
          description: Company-scoped page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoundationPage"
    post:
      operationId: saveFoundation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoundationInput"
      responses:
        "200":
          description: Saved in one audited transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoundationRecord"
  /{company}/accounts/{accountResource}:
    parameters:
      - {name: company, in: path, required: true, schema: {type: string}}
      - {name: accountResource, in: path, required: true, schema: {type: string}}
    get:
      operationId: listAccountsRecords
      parameters:
        - {name: search, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer}}
        - {name: pageSize, in: query, schema: {type: integer}}
        - {name: sort, in: query, schema: {type: string}}
        - {name: direction, in: query, schema: {type: string}}
      responses:
        "200":
          description: Company-scoped paginated accounting records; decimals are strings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FoundationPage"}
    post:
      operationId: saveAccountsRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FoundationInput"}
      responses:
        "200":
          description: Saved, posted, reversed, allocated or approval requested
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FoundationRecord"}
  /{company}/accounts/{accountResource}/{accountRecordId}:
    parameters:
      - {name: company, in: path, required: true, schema: {type: string}}
      - {name: accountResource, in: path, required: true, schema: {type: string}}
      - {name: accountRecordId, in: path, required: true, schema: {type: string}}
    get:
      operationId: getAccountsRecord
      responses:
        "200":
          description: Scoped document detail with lines, allocations and entry links
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FoundationRecord"}
  /{company}/accounts/reports/{reportName}:
    parameters:
      - {name: company, in: path, required: true, schema: {type: string}}
      - {name: reportName, in: path, required: true, schema: {type: string}}
    get:
      operationId: getAccountsReport
      parameters:
        - {name: from, in: query, schema: {type: string}}
        - {name: to, in: query, schema: {type: string}}
        - {name: accountId, in: query, schema: {type: string}}
        - {name: partyId, in: query, schema: {type: string}}
        - {name: departmentId, in: query, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer}}
        - {name: pageSize, in: query, schema: {type: integer}}
      responses:
        "200":
          description: SQL trial balance or ledger, with decimal-string totals and drill-through links
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FoundationPage"}
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: {type: string}
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: {type: string}
        password: {type: string}
    SessionInfo:
      type: object
      required: [user, companies]
      properties:
        user:
          $ref: "#/components/schemas/FoundationRecord"
        companies:
          type: array
          items:
            $ref: "#/components/schemas/FoundationRecord"
    FoundationRecord:
      type: object
      additionalProperties: true
    FoundationInput:
      type: object
      additionalProperties: true
    FoundationPage:
      type: object
      required: [rows, total, page, pageSize]
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/FoundationRecord"
        total: {type: integer}
        page: {type: integer}
        pageSize: {type: integer}
