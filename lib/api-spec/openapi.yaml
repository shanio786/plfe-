openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
servers:
  - url: /api/plfe
paths:
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /session:
    get:
      operationId: getSession
      responses:
        "200":
          description: Current identity and accessible companies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
    delete:
      operationId: logout
      responses:
        "200":
          description: Signed out
  /{company}/{resource}:
    parameters:
      - {name: company, in: path, required: true, schema: {type: string}}
      - {name: resource, in: path, required: true, schema: {type: string}}
    get:
      operationId: listFoundation
      description: "Optional query parameters: search, page, pageSize, sort, direction, status, export=xlsx. See frontend-contract.md."
      responses:
        "200":
          description: Company-scoped page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoundationPage"
    post:
      operationId: saveFoundation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoundationInput"
      responses:
        "200":
          description: Saved in one audited transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoundationRecord"
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: {type: string}
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: {type: string}
        password: {type: string}
    SessionInfo:
      type: object
      required: [user, companies]
      properties:
        user:
          $ref: "#/components/schemas/FoundationRecord"
        companies:
          type: array
          items:
            $ref: "#/components/schemas/FoundationRecord"
    FoundationRecord:
      type: object
      additionalProperties: true
    FoundationInput:
      type: object
      additionalProperties: true
    FoundationPage:
      type: object
      required: [rows, total, page, pageSize]
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/FoundationRecord"
        total: {type: integer}
        page: {type: integer}
        pageSize: {type: integer}
